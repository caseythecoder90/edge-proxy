# caseyrquinn.com (apex — frontend SPA) and www -> apex redirect
server {
    listen 80;
    listen [::]:80;
    server_name caseyrquinn.com www.caseyrquinn.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# www -> apex, so SEO/HSTS see one canonical hostname. Shares the apex cert
# (issued with -d caseyrquinn.com -d www.caseyrquinn.com).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.caseyrquinn.com;

    ssl_certificate     /etc/letsencrypt/live/caseyrquinn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caseyrquinn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://caseyrquinn.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name caseyrquinn.com;

    ssl_certificate     /etc/letsencrypt/live/caseyrquinn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caseyrquinn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://personal-website-frontend:80;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}