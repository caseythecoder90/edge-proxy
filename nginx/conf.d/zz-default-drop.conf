# Loaded last (zz- prefix). Any request whose Host/SNI matches none of the
# server_names above — direct-IP probes, spoofed Host headers, a stale DNS
# record — is dropped with 444 (nginx closes the connection, no response).
# This is the belt-and-suspenders against the cross-routing a shared network
# plus a loose server_name could otherwise cause.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # A default TLS server still needs a cert to finish the handshake before it
    # can close; reuse the apex cert (the connection is dropped regardless).
    ssl_certificate     /etc/letsencrypt/live/caseyrquinn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caseyrquinn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}
